# Proxy inverso con TLS delante del orquestador.
#
# La aplicación habla HTTP en claro por el 8000 y no termina TLS por sí misma;
# este bloque pone el certificado delante, de modo que ni la contraseña del
# agente ni la cookie de sesión viajen legibles por la red local.
#
# Se monta en el contenedor `chatbox-nginx` como /etc/nginx/conf.d/default.conf
# (ver docker-compose.yml, perfil `tls`). Para un nginx instalado en el propio
# host en lugar del contenedor, copie este fichero a `conf.d`, borre la línea
# `resolver` y ponga `set $chatbox_api 127.0.0.1:8000;`.

server {
    listen 80;
    server_name _;

    # Nada de contenido por HTTP: quien llegue al 80 se va al 443, incluido
    # quien tenga el viejo enlace con puerto guardado en el navegador.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Dentro de la red de Compose el host es el nombre del servicio. Se
    # resuelve en cada petición contra el DNS interno de Docker, y no una sola
    # vez al cargar la configuración: al recrear el contenedor `api` —cada
    # `docker compose up -d --build`— cambia de dirección, y un nombre
    # resuelto de antemano dejaría el proxy devolviendo 502 hasta recargarlo
    # a mano.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chatbox_api api:8000;

    ssl_certificate     /etc/nginx/certs/chatbox.crt;
    ssl_certificate_key /etc/nginx/certs/chatbox.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # UPLOAD_MAX_BYTES vale 8 MiB (app/config.py). El margen cubre el sobre
    # multipart: sin él, nginx cortaría la subida con 413 antes de que la
    # aplicación pudiera devolver su propio mensaje de error.
    client_max_body_size 10m;

    # El registro de la aplicación sale en JSON por la salida estándar; este
    # otro deja la traza del proxy en la del contenedor de nginx.
    access_log /var/log/nginx/chatbox.access.log;
    error_log  /var/log/nginx/chatbox.error.log;

    # Chatbox, consola, webhooks de los canales, adjuntos, SAML y estáticos.
    location / {
        proxy_pass http://$chatbox_api;
        proxy_http_version 1.1;

        # `Host` real, no el del upstream: PUBLIC_BASE_URL y la validación
        # estricta de SAML comparan contra el nombre que usó el navegador.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }

    # Avisos en vivo: /ws/chat (chatbox) y /ws/inbox (consola). Sin el cambio
    # de protocolo, la cola común y la cartera dejan de actualizarse solas y
    # el equipo tiene que recargar la página para ver un mensaje nuevo.
    location /ws/ {
        proxy_pass http://$chatbox_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una conexión de consola dura toda la jornada y puede pasar horas en
        # silencio; el minuto por omisión la cerraría sin motivo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Comprobación superficial, sin registrar cada latido del supervisor.
    location = /health {
        proxy_pass http://$chatbox_api;
        proxy_set_header Host $host;
        access_log off;
    }
}
